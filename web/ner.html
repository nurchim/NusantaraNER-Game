<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusantaraEdu-NER</title><style>body{font-family:system-ui;margin:0;background:#f5f1e8;color:#18302f}.x{max-width:760px;margin:80px auto;padding:24px}.card{background:white;border:1px solid #ddd5c6;border-radius:22px;padding:26px}textarea{width:100%;min-height:180px;padding:14px;border:1px solid #ccc;border-radius:12px;box-sizing:border-box}button,a{display:inline-block;margin-top:12px;padding:11px 14px;border-radius:12px;border:0;background:#176b66;color:white;text-decoration:none;font-weight:700}.e{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:10px 0}.muted{color:#687977}</style></head><body><div class="x"><a href="/" style="background:#eee;color:#18302f">← Kembali ke game</a><div class="card"><h1>Analisis NusantaraEdu-NER</h1><p class="muted">Masukkan teks budaya Indonesia untuk melihat entitas yang dikenali model produksi.</p><textarea id="t">Rumah Gadang berkaitan dengan masyarakat Minangkabau di Sumatera Barat.</textarea><br><button onclick="go()">Analisis teks</button><div id="out"></div></div></div><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function go(){out.innerHTML='<p>Menganalisis…</p>';const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});const d=await r.json();out.innerHTML='<h3>Entitas</h3>'+(d.entities||[]).map(e=>`<div class="e"><b>${esc(e.text)}</b><span>${esc(e.label)}</span></div>`).join('')}</script></body></html>
